name: release

on:
  push:
    branches:
      - main

jobs:
  create-release:
    if: contains(github.event.head_commit.message, 'Version bump to')
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Get release tag
        id: get-tag
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          # Pass the commit message as data, never interpolate it into shell code.
          first_line="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
          if [[ "$first_line" =~ Version[[:space:]]bump[[:space:]]to[[:space:]](v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            printf 'tag=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Could not extract a version tag from the bump commit" >&2
            exit 1
          fi
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          tag_name: ${{ steps.get-tag.outputs.tag }}
          draft: true
