name: Deploy

# Publishes the Debian package to a Google Cloud Artifact Registry APT
# repository when a GitHub release is published (release flow: run the
# "bump" workflow -> merge the version-bump PR -> a draft release is created
# by release.yml -> publishing that release triggers this deploy).
# Authentication uses Workload Identity Federation: no service-account keys
# are stored in the repository.
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   Variables (repository-level unless noted):
#     GCP_PROJECT_ID                    dribia-tools
#     GAR_LOCATION                      europe-west1
#     GAR_APT_REPOSITORY                dribia-apt
#     GCP_WORKLOAD_IDENTITY_PROVIDER    org-wide variable; the workload identity
#                                       provider resource name (Terraform output
#                                       `google_ci_identity_pool_provider_name`)
#     GCP_APT_PUBLISHER_SERVICE_ACCOUNT apt-publisher-sa@dribia-tools.iam.gserviceaccount.com
#
# The GCP resources are managed in the dribia-tools-infrastructure Terraform
# repository (APT repo, publisher service account, WIF bindings). See
# docs/releasing.md.

on:
  release:
    types: [published]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC token for Workload Identity Federation

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools desktop-file-utils appstream lintian

      - name: Check version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml)
          DEB_VERSION=$(dpkg-parsechangelog -S Version | cut -d- -f1)
          CONST_VERSION=$(grep -oP '(?<=^VERSION = ")[^"]+' src/clockify_launchers/constants.py)
          echo "tag=$TAG_VERSION pyproject=$PKG_VERSION debian=$DEB_VERSION constants=$CONST_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION"
          test "$TAG_VERSION" = "$DEB_VERSION"
          test "$TAG_VERSION" = "$CONST_VERSION"

      - name: Build Debian package
        run: make deb

      - name: Lintian
        run: make lintian

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/deb/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist/deb

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APT_PUBLISHER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Upload to Artifact Registry APT repository
        run: |
          DEB=$(ls dist/deb/dribia-clockify-launchers_*.deb)
          gcloud artifacts apt upload "${{ vars.GAR_APT_REPOSITORY }}" \
            --location="${{ vars.GAR_LOCATION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --source="$DEB"

      - name: Verify package is listed
        run: |
          gcloud artifacts packages list \
            --repository="${{ vars.GAR_APT_REPOSITORY }}" \
            --location="${{ vars.GAR_LOCATION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" | grep dribia-clockify-launchers

  attach-artifact:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist/deb

      - name: Attach package to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/deb/*.deb
