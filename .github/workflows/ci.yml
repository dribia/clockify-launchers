name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-secret-1 \
            xvfb dbus-x11 xdotool imagemagick python3-dogtail at-spi2-core \
            desktop-file-utils appstream lintian \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            libglib2.0-bin devscripts python3-all python3-setuptools

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check generated packaging files are not tracked
        shell: bash
        run: |
          if git ls-files 'src/*.egg-info/*' 'debian/*.debhelper' 'debian/*.debhelper.*' | grep -q .; then
            echo 'Generated build metadata must not be committed.' >&2
            git ls-files 'src/*.egg-info/*' 'debian/*.debhelper' 'debian/*.debhelper.*'
            exit 1
          fi

      - name: Bootstrap
        run: make bootstrap

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      - name: Validate data files
        run: make validate-data

      - name: UI capture
        run: make ui-capture

      - name: UI tests
        run: make ui-test

      - name: Build Debian package
        run: make deb

      - name: Build and verify Debian source packages
        shell: bash
        run: |
          set -euo pipefail
          make source
          base_version="$(dpkg-parsechangelog -S Version)"
          upstream_version="${base_version%-*}"
          orig="dist/source/dribia-clockify-launchers_${upstream_version}.orig.tar.xz"
          test -s "$orig"
          baseline_hash="$(sha256sum "$orig" | cut -d ' ' -f1)"

          for suite in noble resolute; do
            case "$suite" in
              noble) suffix="24.04" ;;
              resolute) suffix="26.04" ;;
            esac
            PPA_SERIES="$suite" make source
            version="${base_version}~ppa1~ubuntu${suffix}.1"
            changes="dist/source/dribia-clockify-launchers_${version}_source.changes"
            buildinfo="dist/source/dribia-clockify-launchers_${version}_source.buildinfo"
            dsc="dist/source/dribia-clockify-launchers_${version}.dsc"
            test -s "$changes"
            test -s "$buildinfo"
            test -s "$dsc"
            grep -Fx "Distribution: $suite" "$changes"
            grep -Fx "Version: $version" "$changes"
            grep -F "$(basename "$buildinfo")" "$changes"
            test "$(sha256sum "$orig" | cut -d ' ' -f1)" = "$baseline_hash"
          done

      - name: Upload UI artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: artifacts/ui/
          if-no-files-found: ignore
